<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SB Admin 2 - Bootstrap 5 Dashboard</title>

    <!-- Bootstrap 5.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FontAwesome 6 CDN -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts - Nunito -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="admin.css" />

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="admin.js"></script>

    <script>
      $(function () {
        // ดึงไฟล์ sidebar และ topbar มาแสดง
        $("#includedSidebar").load("sidebar.html");

        // 🎯 เติมเครื่องหมาย # หน้า includedTopbar ให้ถูกต้อง
        $("#includedTopbar").load("topbar.html");

        $(document).on(
          "click",
          "#sidebarToggle, #sidebarToggleTop",
          function () {
            const sidebar = document.getElementById("sidebar");
            const toggleIcon = document.getElementById("toggleIcon");

            if (!sidebar) {
              return;
            }

            sidebar.classList.toggle("toggled");
            if (toggleIcon) {
              toggleIcon.classList.toggle("fa-chevron-left");
              toggleIcon.classList.toggle("fa-chevron-right");
            }
          },
        );
      });
    </script>

    <script>
      function loadInactiveSponsors() {
        const $container = $("#sponsorCardContainer");

        // ดึง Template การ์ดใบแรกเก็บไว้เป็นต้นแบบ แล้วซ่อน/เก็บไว้ก่อน
        const $template = $container.find(".sponsor-card-item").first().clone();

        // แสดงสถานะกำลังโหลด
        $container.html(`
            <div class="col-12 text-center py-4 text-muted">
                <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
                กำลังโหลดข้อมูลผู้สนับสนุน...
            </div>
        `);

        // ยิง Ajax ดึงข้อมูลจาก API (ที่ต่อกับ SQL: SELECT * FROM sponsors WHERE status = 'no' ORDER BY id DESC)
        $.ajax({
          url: "/api/sponsors/inactive",
          method: "GET",
          dataType: "json",
          success: function (response) {
            $container.empty(); // เคลียร์ข้อความกำลังโหลดทิ้ง

            //console.log(response.data);
            if (
              !response.success ||
              !response.data ||
              response.data.length === 0
            ) {
              $container.html(`
                    <div class="col-12 text-center py-4 text-muted">
                        <i class="bi bi-inbox fs-3 d-block mb-1"></i>
                        ไม่พบรายการผู้สนับสนุนที่มีสถานะปิดใช้งาน
                    </div>
                `);
              return;
            }

            // วนลูปข้อมูลแต่ละรายการจากฐานข้อมูล
            response.data.forEach((item) => {
              const $cardItem = $template.clone(); // โคลนโครงสร้างการ์ดที่เตรียมไว้

              $cardItem
                .find(".sponsor-img")
                .attr("src", item.image_path || "assets/default-logo.png")
                .attr("alt", item.sponsor_name);

              $cardItem
                .find(".sponsor-code")
                .text(`รหัส : ${item.sponsor_code}`);

              $cardItem
                .find(".sponsor-name")
                .text(item.sponsor_name)
                .attr("title", item.sponsor_name);

              // นำการ์ดที่เติมข้อมูลเรียบร้อยแล้ว แปะใส่ลงใน Container หลัก
              $container.append($cardItem);
            });
          },
          error: function (xhr, status, error) {
            console.error("Error:", error);
            $container.html(`
                <div class="col-12 text-center py-4 text-danger">
                    <i class="bi bi-exclamation-triangle fs-3 d-block mb-1"></i>
                    ไม่สามารถโหลดข้อมูลผู้สนับสนุนได้
                </div>
            `);
          },
        });
      }

      // สั่งให้ทำงานทันทีเมื่อเปิดหน้าเว็บ
      $(document).ready(function () {
        loadInactiveSponsors();
      });

      // โหลดข้อมูลผู้สนับสนุนที่เปิดใช้งานเมื่อเปิด Modal
      $(document).on("show.bs.modal", "#settingModal", function () {
        loadActiveSponsorsForModal();
      });

      function loadActiveSponsorsForModal() {
        const $modalList = $("#modalSponsorList");

        $.ajax({
          url: "/api/sponsors/inactive",
          method: "GET",
          dataType: "json",
          success: function (response) {
            $modalList.empty();

            if (
              !response.success ||
              !response.data ||
              response.data.length === 0
            ) {
              $modalList.html(`
                    <div class="text-center py-3 text-muted" style="font-size: 24px;">
                        ไม่พบผู้สนับสนุนที่มีสถานะเปิดใช้งาน
                    </div>
                `);
              return;
            }

            const sponsors = response.data;
            const defaultShare = Math.floor(100 / sponsors.length); // หารเฉลี่ยเบื้องต้น

            // วนลูปสร้างรายการแต่ละตัว
            sponsors.forEach((sponsor, index) => {
              // กำหนดค่าเริ่มต้นให้ตัวแรกรับส่วนที่เหลือจากการหาร
              let initialVal = defaultShare;
              if (index === sponsors.length - 1) {
                // ตัวสุดท้ายปัดเศษให้รวมได้ 100 พอดี
                let currentSum = defaultShare * (sponsors.length - 1);
                initialVal = 100 - currentSum;
              }

              const itemHtml = `
                  <!-- 📌 ใส่ data-code ไว้ที่กล่องนอกสุด เพื่อให้ตอนกดบันทึกสามารถดึงค่าได้ง่าย -->
                  <div class="d-flex align-items-center justify-content-between p-2 border rounded-3 bg-light shadow-sm sponsor-ratio-item" 
                      data-code="${sponsor.sponsor_code}">
                      
                      <div class="d-flex align-items-center gap-2 overflow-hidden">
                          <img src="${sponsor.image_path || "assets/default-logo.png"}" class="rounded-2 shadow-sm" style="width: 40px; height: 40px; object-fit: cover;">
                          <div class="text-truncate">
                              <div class="fw-bold text-dark text-truncate" style="font-size: 18px;">${sponsor.sponsor_name}</div>
                              
                              <!-- แสดงข้อความรหัสให้ผู้ใช้เห็นบนหน้าจอ -->
                              <div class="text-muted" style="font-size: 16px;">
                                  รหัส: ${sponsor.sponsor_code}
                              </div>
                          </div>
                      </div>

                      <!-- ช่องกรอกตัวเลขสัดส่วน -->
                      <div class="input-group input-group-sm" style="width: 100px;">
                          <input type="number" class="form-control text-center fw-bold ratio-input" value="${initialVal}" min="0" max="100">
                          <span class="input-group-text bg-white text-muted" style="font-size: 16px;">ครั้ง</span>
                      </div>
                  </div>
              `;
              $modalList.append(itemHtml);
            });

            updateTotalRatio();
          },
          error: function (err) {
            console.error("Error loading active sponsors:", err);
            $modalList.html(
              '<div class="text-center text-danger py-2" style="font-size: 13px;">ไม่สามารถโหลดข้อมูลได้</div>',
            );
          },
        });
      }

      // 🧮 ระบบคำนวณอัตโนมัติ (สมมติมี 2 ตัว ตัวแรกเปลี่ยน ตัวที่ 2 จะปรับลด/เพิ่มให้รวมเป็น 100 ทันที)
      $(document).on("input", ".ratio-input", function () {
        const $inputs = $(".ratio-input");
        const changedInput = this;
        let total = 0;

        // คำนวณผลรวมปัจจุบัน
        $inputs.each(function () {
          total += parseInt($(this).val()) || 0;
        });

        // ถ้ามี 2 ตัว และเกิน 100 หรืออยากให้คำนวณตัวที่เหลืออัตโนมัติ (กรณีมี 2 รายการ)
        if ($inputs.length === 2) {
          const $otherInput = $inputs.not(changedInput);
          let val = 100 - (parseInt($(changedInput).val()) || 0);
          if (val < 0) val = 0;
          if (val > 100) val = 100;
          $otherInput.val(val);
        }

        updateTotalRatio();
      });

      function updateTotalRatio() {
        let total = 0;
        $(".ratio-input").each(function () {
          total += parseInt($(this).val()) || 0;
        });

        const $badge = $("#totalRatioBadge");
        $badge.text(`รวม: ${total} / 100`);

        if (total === 100) {
          $badge.removeClass("bg-danger").addClass("bg-success");
        } else {
          $badge.removeClass("bg-success").addClass("bg-danger");
        }
      }

      async function saveSettings() {
        const ratios = [];
        let total = 0;

        // 1. วนลูปเก็บข้อมูลจากแต่ละแถวใน Modal
        $(".sponsor-ratio-item").each(function () {
          const sponsor_code = $(this).data("code"); // ดึงรหัสผู้สนับสนุนจาก data-code
          const count = parseInt($(this).find(".ratio-input").val()) || 0;

          console.log("Sponsor Code:", sponsor_code, "Count:", count);

          ratios.push({
            sponsor_code: sponsor_code,
            ratio_count: count,
          });
          total += count;
        });

        // 2. ตรวจสอบผลรวมต้องเท่ากับ 100
        if (total !== 100) {
          Swal.fire({
            icon: "warning",
            title: "สัดส่วนไม่ถูกต้อง",
            text: `ผลรวมสัดส่วนต้องเท่ากับ 100 ครั้ง (ปัจจุบันรวมได้ ${total} ครั้ง)`,
            confirmButtonText: "ตกลง",
            confirmButtonColor: "#198754",
          });
          return;
        }

        try {
          // 3. ส่งข้อมูลไปที่ Backend
          const response = await fetch("/api/sponsor-ratios", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ratios }),
          });

          const result = await response.json();

          if (response.ok && result.success) {
            // ปิด Modal
            const modalElement = document.getElementById("settingModal");
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            if (modalInstance) modalInstance.hide();
            // 🔄 เรียกอัปเดตข้อความที่ Badge ทันที
            loadCurrentRatioSummary();
            Swal.fire({
              icon: "success",
              title: "บันทึกสำเร็จ!",
              text: "บันทึกสัดส่วนผู้สนับสนุนเรียบร้อยแล้ว",
              timer: 1500,
              showConfirmButton: false,
            });
          } else {
            Swal.fire(
              "ผิดพลาด!",
              result.message || "ไม่สามารถบันทึกข้อมูลได้",
              "error",
            );
          }
        } catch (error) {
          console.error("Error saving settings:", error);
          Swal.fire("ผิดพลาด!", "ไม่สามารถเชื่อมต่อกับ Server ได้", "error");
        }
      }

      // ฟังก์ชันสำหรับดึงสัดส่วนปัจจุบันมาแสดงที่ Badge
      function loadCurrentRatioSummary() {
        $.ajax({
          url: "/api/sponsor-ratios",
          method: "GET",
          dataType: "json",
          success: function (response) {
            if (response.success && response.data && response.data.length > 0) {
              // ดึงเฉพาะค่า quantity มาเก็บเป็น Array เช่น [60, 40]
              const quantities = response.data.map((item) => item.quantity);

              // นำมาต่อกันด้วยเครื่องหมาย / เช่น "60/40"
              const ratioText = quantities.join("/");

              // แสดงผลที่ Badge
              $("#ratioSummaryBadge").text(ratioText);
            } else {
              $("#ratioSummaryBadge").text("0/0");
            }
          },
          error: function (err) {
            console.error("Error loading ratio summary:", err);
          },
        });
      }
      // 1. สั่งให้ทำงานทันทีเมื่อเปิดหน้าเว็บ
      $(document).ready(function () {
        loadCurrentRatioSummary();
      });
    </script>
  </head>
  <body>
    <div id="wrapper">
      <!-- Sidebar -->
      <div id="includedSidebar"></div>
      <!-- End of Sidebar -->

      <!-- Content Wrapper -->
      <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
          <!-- Topbar -->
          <div id="includedTopbar"></div>
          <!-- End of Topbar -->

          <!-- Begin Page Content -->
          <div class="container-fluid px-4">
            <!-- การ์ดสำหรับกดคลิกเพื่อเปิด Modal -->
          </div>

          <div class="container-fluid px-4">
            <div
              class="d-flex align-items-center justify-content-between mb-4 w-100"
            >
              <!-- หัวข้อหน้าจอ (อยู่ฝั่งซ้าย) -->

              <!-- ปุ่มเพิ่ม Sponsors (ถูกดันชิดมุมขวาด้วย ms-auto หรือ justify-content-between) -->
            </div>

            <div
              class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3"
            >
              <!-- ฝั่งซ้าย: หัวข้อและสถานะ -->
              <div>
                <h3 class="fw-bold text-gay mb-1" style="font-size: 24px">
                  <i class="bi bi-clipboard-heart text-success me-2"></i>
                  รายการผู้สนับสนุนที่ร่วมงานนี้
                </h3>
                <div
                  class="text-muted d-flex align-items-center gap-2"
                  style="
                    font-size: 24px;
                    font-family: &quot;Kanit&quot;, sans-serif;
                  "
                >
                  <span>รูปแบบการแจกใน 100 ครั้ง:</span>
                  <span
                    id="ratioSummaryBadge"
                    class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 fw-bold"
                    style="font-size: 22px"
                  >
                    50/50
                  </span>
                </div>
              </div>

              <!-- ฝั่งขวา: ปุ่มตั้งค่า (คลิกแล้วเปิด Modal) -->
              <div>
                <button
                  type="button"
                  class="btn btn-outline-success btn-sm px-3 py-2 rounded-pill shadow-sm d-flex align-items-center gap-1"
                  data-bs-toggle="modal"
                  data-bs-target="#settingModal"
                  style="font-weight: 500; font-size: 18px"
                >
                  <i class="bi bi-gear-fill"></i> ตั้งค่า
                </button>
              </div>
            </div>

            <!-- แถวสำหรับแสดงการ์ด (กำหนด id และให้แสดง 6 รายการต่อแถวในจอใหญ่ด้วย col-lg-2) -->
            <div class="row g-3" id="sponsorCardContainer">
              <!-- 📌 Template การ์ดเปล่า (ใช้เป็นต้นแบบให้ jQuery โคลนและเติมข้อมูล) -->

              <div class="col-6 col-md-4 col-lg-2 sponsor-card-item">
                <div
                  class="card shadow-sm position-relative h-100 border-0 rounded-4 overflow-hidden bg-white hover-shadow transition-all"
                >
                  <!-- เนื้อหาการ์ด -->
                  <div
                    class="card-body text-center pt-4 px-2 pb-2 d-flex flex-column align-items-center"
                  >
                    <!-- รูปภาพโลโก้ (เปิดใช้งานโครงสร้างรูปภาพ) -->
                    <div class="position-relative mb-2">
                      <img
                        src=""
                        alt=""
                        class="rounded-3 shadow-sm sponsor-img"
                        style="
                          width: 200px;
                          height: 200px;
                          object-fit: cover;
                          border: 1px solid #f0f0f0;
                        "
                      />
                    </div>

                    <!-- รหัสผู้สนับสนุน -->
                    <div class="mb-1">
                      <span
                        class="badge bg-light text-secondary px-2 py-1 sponsor-code"
                        style="font-size: 24px; letter-spacing: 0.5px"
                      >
                        <!-- ข้อมูลจะถูกใส่มาตรงนี้ -->
                      </span>
                    </div>

                    <!-- ชื่อผู้สนับสนุน -->
                    <div class="w-90 text-truncate">
                      <span
                        class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 w-100 text-truncate sponsor-name"
                        style="
                          font-family: &quot;Google Sans&quot;, sans-serif;
                          font-size: 24px;
                          font-weight: 500;
                        "
                      >
                        <!-- ข้อมูลจะถูกใส่มาตรงนี้ -->
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- ⚙️ Modal ตั้งค่ารูปแบบการแจก -->
          <div
            class="modal fade"
            id="settingModal"
            tabindex="-1"
            aria-labelledby="settingModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-dialog-centered">
              <div
                class="modal-content border-0 shadow-lg rounded-4 overflow-hidden"
              >
                <!-- Modal Header -->
                <div class="modal-header bg-light border-0 px-4 py-3">
                  <h5
                    class="modal-title fw-bold text-gay"
                    id="settingModalLabel"
                    style="font-size: 24px"
                  >
                    <i class="bi bi-gear-fill text-success me-2"></i>
                    ตั้งค่ารูปแบบการแจกของรางวัล
                  </h5>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>

                <!-- Modal Body -->

                <div class="modal-body p-4">
                  <form id="sponsorRatioForm">
                    <div
                      class="mb-3 d-flex justify-content-between align-items-center"
                    >
                      <label
                        class="form-label fw-bold text-secondary mb-0"
                        style="font-size: 18px"
                      >
                        <i class="bi bi-pie-chart-fill text-success me-1"></i>
                        จัดสรรสัดส่วนผู้สนับสนุน 
                      </label>
                      <!-- แสดงผลยอดรวมแบบ Real-time -->
                      <span
                        id="totalRatioBadge"
                        class="badge bg-success px-2 py-1"
                        style="font-size: 18px"
                        >100 / 100</span
                      >
                    </div>

                    <!-- กล่องสำหรับแสดงรายการผู้สนับสนุนที่ status = 'yes' (ดึงมาแสดงด้วย jQuery) -->
                    <div
                      id="modalSponsorList"
                      class="d-flex flex-column gap-2"
                      style="
                        max-height: 350px;
                        overflow-y: auto;
                        padding-right: 4px;
                      "
                    >
                      <div
                        class="text-center py-3 text-muted"
                        style="font-size: 20px"
                      >
                        <div
                          class="spinner-border spinner-border-sm text-success me-2"
                          role="status"
                        ></div>
                        กำลังโหลดรายชื่อผู้สนับสนุน...
                      </div>
                    </div>
                  </form>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer border-0 px-4 pb-4 pt-0">
                  <button
                    type="button"
                    class="btn btn-danger rounded-pill px-4 text-white"
                    data-bs-dismiss="modal"
                    style="font-size: 18px"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    class="btn btn-success rounded-pill px-4 shadow-sm"
                    style="font-size: 18px"
                    onclick="saveSettings()"
                  >
                    บันทึกการตั้งค่า
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <footer class="sticky-footer bg-white py-3 border-top mt-auto">
          <div class="container my-auto">
            <div class="copyright text-center my-auto small text-muted">
              <span>Copyright &copy; Your Website 2026</span>
            </div>
          </div>
        </footer>
        <!-- End of Footer -->
      </div>
      <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Logout Modal-->
    <div
      class="modal fade"
      id="logoutModal"
      tabindex="-1"
      aria-labelledby="logoutModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
