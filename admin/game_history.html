<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SB Admin 2 - Bootstrap 5 Dashboard</title>

    <!-- Bootstrap 5.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FontAwesome 6 CDN -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts - Nunito -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="admin.css" />

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script src="admin.js"></script>

    <script>
      $(function () {
        // ดึงไฟล์ sidebar และ topbar มาแสดง
        $("#includedSidebar").load("sidebar.html");

        // 🎯 เติมเครื่องหมาย # หน้า includedTopbar ให้ถูกต้อง
        $("#includedTopbar").load("topbar.html");

        $(document).on(
          "click",
          "#sidebarToggle, #sidebarToggleTop",
          function () {
            const sidebar = document.getElementById("sidebar");
            const toggleIcon = document.getElementById("toggleIcon");

            if (!sidebar) {
              return;
            }

            sidebar.classList.toggle("toggled");
            if (toggleIcon) {
              toggleIcon.classList.toggle("fa-chevron-left");
              toggleIcon.classList.toggle("fa-chevron-right");
            }
          },
        );
      });
    </script>

    <script>
      let currentPage = 1;
      let lastHistoryCount = null;
      let checkingHistoryCount = false;

      function renderGameHistoryTable(page = 1) {
        currentPage = page;
        const $tbody = $("#gameHistoryTableBody");
        const $pagination = $("#paginationContainer");
        const $info = $("#tableInfo");

        $tbody.html(
          `<tr><td colspan="5" class="text-center text-muted py-4">กำลังโหลดข้อมูล...</td></tr>`,
        );

        // ยิง API พร้อมส่งเลขหน้าไป (เช่น /api/game-history/data?page=1)
        $.get(`/api/game-history/data?page=${page}`, function (result) {
          $tbody.empty();
          if (result.success && result.pagination) {
            lastHistoryCount = Number(result.pagination.totalItems);
          }

          if (result.success && result.data && result.data.length > 0) {
            const { currentPage, totalPages, totalItems } = result.pagination;

            $.each(result.data, function(index, item) {
            // 1. คำนวณเลขลำดับให้เรียงจากมากไปน้อย
            let runningNumber = totalItems - ((currentPage - 1) * 10) - index;

            // 2. เช็คว่าเป็นแถวแรกสุดของหน้าแรกหรือไม่ (รายการล่าสุด)
            let isLatestRow = (currentPage === 1 && index === 0);
            
            // กำหนดสีพื้นหลังและสีตัวอักษรของช่องลำดับ (<td>)
           let tdStyle = isLatestRow 
                ? 'background-color: #d1e7dd; color: #0f5132; font-weight: bold; border-color: #badbcc;' 
                : ''; // ช่องปกติ (โทนสีเขียวพาสเทล สบายตา)

            let rowHtml = `
                <tr>
                    <!-- ใส่สไตล์ช่อง td สำหรับรายการล่าสุด -->
                    <td class="text-center align-middle ${isLatestRow ? 'border border-success-subtle' : ''}" style="${tdStyle}">${runningNumber}</td>
                    <td class="text-center align-middle ${isLatestRow ? 'border border-success-subtle' : ''}" style="${tdStyle}">${item.player_name || '-'}</td>
                    <td class="text-center align-middle ${isLatestRow ? 'border border-success-subtle' : ''}" style="${tdStyle}">${item.prize_name || '-'}</span></td>
                    <td class="text-center align-middle ${isLatestRow ? 'border border-success-subtle' : ''}" style="${tdStyle}">${item.special_prize && item.special_prize !== '-' ? `${item.special_prize}` : '-'}</td>
                    <td class="text-center text-muted small ${isLatestRow ? 'border border-success-subtle' : ''}" style="${tdStyle}">${item.datetime || '-'}</td>
                </tr>
            `;
            $tbody.append(rowHtml);
        });

            // แสดงข้อความสรุปข้อมูล
            let startItem = (currentPage - 1) * 10 + 1;
            let endItem = Math.min(currentPage * 10, totalItems);
            $info.text(
              `แสดง ${startItem}-${endItem} จากทั้งหมด ${totalItems} รายการ`,
            );

            // สร้างปุ่ม Pagination
            $pagination.empty();

            // ปุ่ม "ก่อนหน้า" (Previous)
            let prevDisabled = currentPage === 1 ? "disabled" : "";
            $pagination.append(`
                <li class="page-item ${prevDisabled}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">ก่อนหน้า</a>
                </li>
            `);

            // ปุ่มตัวเลขหน้า (แสดงแบบง่ายๆ ทุกหน้า หรือจำกัดช่วงได้)
            for (let i = 1; i <= totalPages; i++) {
              let activeClass = i === currentPage ? "active" : "";
              $pagination.append(`
                    <li class="page-item ${activeClass}">
                        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
                    </li>
                `);
            }

            // ปุ่ม "ถัดไป" (Next)
            let nextDisabled = currentPage === totalPages ? "disabled" : "";
            $pagination.append(`
                <li class="page-item ${nextDisabled}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">ถัดไป</a>
                </li>
            `);
          } else {
            $tbody.html(
              `<tr><td colspan="5" class="text-center text-muted py-4">ไม่พบประวัติการเล่นในระบบ</td></tr>`,
            );
            $info.text(`แสดง 0 รายการ`);
            $pagination.empty();
          }
        }).fail(function () {
          $tbody.html(
            `<tr><td colspan="5" class="text-center text-danger py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`,
          );
        });
      }

      async function refreshHistoryTableWhenChanged() {
        if (checkingHistoryCount) return;
        checkingHistoryCount = true;

        try {
          const response = await fetch("/api/game-history/count", {
            cache: "no-store",
          });
          const result = await response.json();
          if (!response.ok || !result.success || !Number.isFinite(Number(result.total))) {
            throw new Error(result.message || "ไม่สามารถตรวจสอบจำนวนประวัติได้");
          }

          const latestCount = Number(result.total);
          if (lastHistoryCount !== null && latestCount !== lastHistoryCount) {
            lastHistoryCount = latestCount;
            renderGameHistoryTable(currentPage);
          }
        } catch (error) {
          console.error("Error checking for new game history:", error);
        } finally {
          checkingHistoryCount = false;
        }
      }

      // ฟังก์ชันสำหรับกดเปลี่ยนหน้า
      function changePage(page) {
        if (page < 1) return;
        renderGameHistoryTable(page);
      }

      async function exportTableToExcel() {
        const exportButton = document.querySelector(
          'button[onclick="exportTableToExcel()"]',
        );
        if (exportButton) exportButton.disabled = true;

        try {
          const response = await fetch("/api/game-history/export");
          const result = await response.json();
          if (!response.ok || !result.success || !Array.isArray(result.data)) {
            throw new Error(result.message || "ไม่สามารถดึงข้อมูลประวัติทั้งหมดได้");
          }

          const headers = [
            "ลำดับ",
            "ชื่อผู้เล่น",
            "รางวัลที่ได้รับ",
            "รางวัลพิเศษ",
            "วัน/เดือน/ปี เวลา",
          ];
          const rows = result.data.map((item, index) => [
            result.data.length - index,
            item.player_name || "-",
            item.prize_name || "-",
            item.special_prize && item.special_prize !== "-"
              ? item.special_prize
              : "-",
            item.datetime || "-",
          ]);
          const worksheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "ประวัติรับรางวัล");
          XLSX.writeFile(workbook, "game-history.xlsx");
        } catch (error) {
          console.error("Error exporting game history:", error);
          Swal.fire(
            "ส่งออกไม่สำเร็จ",
            error.message || "ไม่สามารถเชื่อมต่อกับ Server ได้",
            "error",
          );
        } finally {
          if (exportButton) exportButton.disabled = false;
        }
      }

      // เรียกใช้งานเมื่อโหลดหน้าเว็บครั้งแรก
      $(document).ready(function () {
        renderGameHistoryTable(1);
        window.setInterval(refreshHistoryTableWhenChanged, 2000);
      });

      
    </script>
  </head>
  <body>
    <div id="wrapper">
      <!-- Sidebar -->
      <div id="includedSidebar"></div>
      <!-- End of Sidebar -->

      <!-- Content Wrapper -->
      <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
          <!-- Topbar -->
          <div id="includedTopbar"></div>
          <!-- End of Topbar -->

     

          <div class="container-fluid px-4">  
            <!-- แถวสำหรับแสดงการ์ด (กำหนด id และให้แสดง 6 รายการต่อแถวในจอใหญ่ด้วย col-lg-2) -->

            <div class="row g-3">

              <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-bold text-gay mb-1" style="font-size: 24px">
                          <i class="bi bi-clock text-success me-2"></i>
                          ประวัติการรับของรางวัล
                        </h3>
                <!-- ปุ่ม Export Excel -->
                    <button type="button" class="btn btn-success btn-sm px-3" onclick="exportTableToExcel()">
                        <i class="bi bi-file-earmark-excel me-1"></i> Export Excel
                    </button>
              </div>
          
                <div
                  class="table-responsive shadow-sm overflow-hidden bg-white p-2"
                >
                  <table
                    class="table table-striped table-hover mb-0"
                    id="gameHistoryTable"
                  >
                    <thead class="table-dark">
                      <tr>
                        <th scope="col" class="text-center" style="width: 80px">
                          ลำดับ
                        </th>
                        <th scope="col" class="text-center">ชื่อผู้เล่น</th>
                        <th scope="col" class="text-center">รางวัลที่ได้รับ</th>
                        <th scope="col" class="text-center">รางวัลพิเศษ</th>
                        <th scope="col" class="text-center">
                          วัน/เดือน/ปี เวลา
                        </th>
                      </tr>
                    </thead>
                    <tbody id="gameHistoryTableBody">
                      <!-- ข้อมูลจะถูกแทรกเข้ามาตรงนี้ด้วย JavaScript -->
                      <tr>
                        <td colspan="5" class="text-center text-muted py-4">
                          กำลังโหลดข้อมูล...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- ส่วนสำหรับแสดงปุ่มเปลี่ยนหน้า -->
                <nav
                  class="d-flex justify-content-between align-items-center mt-3 px-2"
                >
                  <div id="tableInfo" class="text-muted small">
                    กำลังโหลดข้อมูล...
                  </div>
                  <ul class="pagination mb-0" id="paginationContainer">
                    <!-- ปุ่ม Pagination จะถูกสร้างอัตโนมัติ -->
                  </ul>
                </nav>
         
            </div>
          </div>

          <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <footer class="sticky-footer bg-white py-3 border-top mt-auto">
          <div class="container my-auto">
            <div class="copyright text-center my-auto small text-muted">
              <span>Copyright &copy; Your Website 2026</span>
            </div>
          </div>
        </footer>
        <!-- End of Footer -->
      </div>
      <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Logout Modal-->
    <div
      class="modal fade"
      id="logoutModal"
      tabindex="-1"
      aria-labelledby="logoutModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="logoutModalLabel">Ready to Leave?</h5>
            <button
              class="btn-close"
              type="button"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            Select "Logout" below if you are ready to end your current session.
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-secondary"
              type="button"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <a class="btn btn-primary" href="#">Logout</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
