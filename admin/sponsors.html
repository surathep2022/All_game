<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SponSors</title>

    <!-- Bootstrap 5.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FontAwesome 6 CDN -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts - Nunito -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="admin.css" />

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="admin.js"></script>

    <script>
      $(function () {
        // ดึงไฟล์ sidebar และ topbar มาแสดง
        $("#includedSidebar").load("sidebar.html");

        // 🎯 เติมเครื่องหมาย # หน้า includedTopbar ให้ถูกต้อง
        $("#includedTopbar").load("topbar.html");

        $(document).on(
          "click",
          "#sidebarToggle, #sidebarToggleTop",
          function () {
            const sidebar = document.getElementById("sidebar");
            const toggleIcon = document.getElementById("toggleIcon");

            if (!sidebar) {
              return;
            }

            sidebar.classList.toggle("toggled");
            if (toggleIcon) {
              toggleIcon.classList.toggle("fa-chevron-left");
              toggleIcon.classList.toggle("fa-chevron-right");
            }
          },
        );
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        loadSponsors();

        // 1. จัดการฟอร์มบันทึกข้อมูล Sponsor
        const addSponsorForm = document.getElementById("addSponsorForm");
        if (addSponsorForm) {
          addSponsorForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const btnSave = document.getElementById("btnSaveSponsor");
            btnSave.disabled = true;
            btnSave.innerText = "กำลังบันทึก...";

            try {
              const response = await fetch("/api/sponsors", {
                method: "POST",
                body: formData,
              });

              const responseText = await response.text();
              let result;
              try {
                result = JSON.parse(responseText);
              } catch {
                throw new Error(
                  `เซิร์ฟเวอร์ตอบกลับข้อมูลไม่ถูกต้อง (HTTP ${response.status})`,
                );
              }

              if (response.ok && result.success) {
                Swal.fire({
                  icon: "success",
                  title: "สำเร็จ!",
                  text: "บันทึกข้อมูลผู้สนับสนุนเรียบร้อยแล้ว",
                  timer: 1500,
                  showConfirmButton: false,
                });

                const modalElement =
                  document.getElementById("addSponsorModal");
                const modalInstance =
                  bootstrap.Modal.getInstance(modalElement);
                if (modalInstance) modalInstance.hide();

                this.reset();
                const preview = document.getElementById(
                  "sponsorImagePreview",
                );
                if (preview) preview.style.display = "none";

                loadSponsors();
              } else {
                Swal.fire("ผิดพลาด!", result.message, "error");
              }
            } catch (error) {
              console.error("Error:", error);
              Swal.fire(
                "ผิดพลาด!",
                error.message || "ไม่สามารถเชื่อมต่อกับ Server ได้",
                "error",
              );
            } finally {
              btnSave.disabled = false;
              btnSave.innerText = "บันทึกข้อมูล";
            }
          });
        }

        // เปิด Modal แล้วเจนรหัสอัตโนมัติ
        const addSponsorModal = document.getElementById("addSponsorModal");
        if (addSponsorModal) {
          addSponsorModal.addEventListener("show.bs.modal", function () {
            generateSponsorCode();
          });
        }
      });

      // ฟังก์ชันสุ่มรหัส Sponsor 6 หลัก
      function generateSponsorCode() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let result = "";
        for (let i = 0; i < 6; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        const codeInput = document.getElementById("sponsor_code");
        if (codeInput) codeInput.value = result;
      }

      // พรีวิวรูปโลโก้ Sponsor
      function previewSponsorImage(event) {
        const reader = new FileReader();
        reader.onload = function () {
          const output = document.getElementById("sponsorImagePreview");
          if (output) {
            output.src = reader.result;
            output.style.display = "inline-block";
          }
        };
        if (event.target.files[0]) {
          reader.readAsDataURL(event.target.files[0]);
        }
      }

      // ==================== SPONSORS MODULE ====================

      // โหลดรายการ Sponsors ทั้งหมดมาแสดง
      async function loadSponsors() {
        const container = document.getElementById("sponsorCardContainer");
        if (!container) return;
        container.innerHTML = "";

        try {
          const response = await fetch("/api/sponsors");
          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "ไม่สามารถดึงข้อมูลผู้สนับสนุนได้");
          }

          if (!Array.isArray(result.data)) {
            throw new Error("รูปแบบข้อมูลผู้สนับสนุนไม่ถูกต้อง");
          }

          if (result.data.length === 0) {
            container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-muted" style="font-family: 'Kanit', sans-serif;">ยังไม่มีรายการผู้สนับสนุน</p>
                    </div>
                `;
            return;
          }

          result.data.forEach((item) => {
            const isChecked = item.status === "on" ? "checked" : "";
            const col = document.createElement("div");
            col.className = "col-6 col-md-4 col-lg-2";

            col.innerHTML = `
                    <div class="card shadow-sm position-relative h-100 border-0 rounded-4 overflow-hidden bg-white hover-shadow transition-all">
                        
                        <!-- 🔘 Switch เปิด-ปิด -->
                        <div class="position-absolute top-0 end-0 p-2" style="z-index: 10;">
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" role="switch" ${isChecked} 
                                       style="cursor: pointer; transform: scale(1.1);"
                                       onchange="updateSponsorStatus(${item.id}, this)">
                            </div>
                        </div>

                        <!-- เนื้อหาการ์ด -->
                        <div class="card-body text-center pt-4 px-2 pb-2 d-flex flex-column align-items-center">
                            
                            <!-- รูปภาพโลโก้ -->
                            <div class="position-relative mb-2">
                                <img src="${item.image_path}" alt="${item.sponsor_name}" 
                                     class="rounded-3 shadow-sm" 
                                     style="width: 100px; height: 100px; object-fit: cover; border: 1px solid #f0f0f0;">
                            </div>
                            
                            <!-- รหัสผู้สนับสนุน -->
                            <div class="mb-1">
                                <span class="badge bg-light text-secondary px-2 py-1" style="font-size: 12px; letter-spacing: 0.5px;">
                                    รหัส : ${item.sponsor_code}
                                </span>
                            </div>

                            <!-- ชื่อผู้สนับสนุน -->
                            <div class="w-100 text-truncate">
                                <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 w-90 text-truncate" 
                                      style="font-family: 'Google Sans', sans-serif; font-size: 13px; font-weight: 500;" 
                                      title="${item.sponsor_name}">
                                    ${item.sponsor_name}
                                </span>
                            </div>

                        </div>

                        <!-- ปุ่มลบ -->
                        <div class="card-footer bg-transparent border-0 text-center pb-3 pt-0 px-3">
                            <button class="btn btn-outline-danger w-100 py-1" style="font-size: 11px; border-radius: 8px; font-weight: 500;" onclick="deleteSponsor(${item.id})">
                                <i class="bi bi-trash me-1"></i> ลบ
                            </button>
                        </div>
                    </div>
                `;
            container.appendChild(col);
          });
        } catch (error) {
          console.error("Error loading sponsors:", error);
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <p class="text-danger" style="font-family: 'Kanit', sans-serif;">โหลดข้อมูลผู้สนับสนุนไม่สำเร็จ กรุณาลองใหม่อีกครั้ง</p>
            </div>
          `;
        }
      }

      // อัปเดตสถานะ Sponsor (on/off)
      async function updateSponsorStatus(id, checkbox) {
        const newStatus = checkbox.checked ? "on" : "off";

        try {
          const response = await fetch("/api/sponsors/status", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id, status: newStatus }),
          });

          const result = await response.json();

          if (!result.success) {
            alert("เกิดข้อผิดพลาด: " + result.message);
            checkbox.checked = !checkbox.checked;
          } else {
            Swal.fire({
              html: `
                    <div class="alert theme-success text-success bg-success-subtle border border-success-subtle rounded-3 p-3 mb-0 shadow-sm" role="alert" style="font-family: 'Kanit', sans-serif;">
                        <div class="d-flex align-items-center justify-content-center">
                            <i class="bi bi-check-circle-fill fs-4 me-2"></i>
                            <div>
                                <h6 class="fw-bold mb-1">อัปเดตสถานะสำเร็จ!</h6>
                                <p class="mb-0 small">เปลี่ยนสถานะผู้สนับสนุนเรียบร้อยแล้ว</p>
                            </div>
                        </div>
                    </div>
                `,
              showConfirmButton: false,
              timer: 1200,
              background: "transparent",
              customClass: { popup: "border-0 bg-transparent shadow-none" },
            });
          }
        } catch (error) {
          console.error("Error:", error);
          alert("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้");
          checkbox.checked = !checkbox.checked;
        }
      }

      // ลบผู้สนับสนุน
      async function deleteSponsor(id) {
        const confirmResult = await Swal.fire({
          title: "คุณต้องการลบใช่หรือไม่?",
          text: "เมื่อลบแล้วจะไม่สามารถกู้คืนข้อมูลกลับมาได้!",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#dc3545",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "ใช่, ลบเลย!",
          cancelButtonText: "ยกเลิก",
          reverseButtons: true,
        });

        if (confirmResult.isConfirmed) {
          try {
            const response = await fetch(`/api/sponsors/${id}`, {
              method: "DELETE",
            });
            const result = await response.json();

            if (result.success) {
              const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 1500,
                timerProgressBar: true,
              });

              Toast.fire({
                icon: "success",
                title: "ลบผู้สนับสนุนเรียบร้อยแล้ว",
              });
              loadSponsors();
            } else {
              Swal.fire("ผิดพลาด!", result.message, "error");
            }
          } catch (error) {
            console.error("Error:", error);
            Swal.fire("ผิดพลาด!", "ไม่สามารถเชื่อมต่อกับ Server ได้", "error");
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="wrapper">
      <!-- Sidebar -->
      <div id="includedSidebar"></div>
      <!-- End of Sidebar -->

      <!-- Content Wrapper -->
      <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
          <!-- Topbar -->
          <div id="includedTopbar"></div>
          <!-- End of Topbar -->

          <!-- Begin Page Content -->
          <div class="container-fluid px-4">
            <!-- การ์ดสำหรับกดคลิกเพื่อเปิด Modal -->
          </div>

          <div class="container-fluid px-4">
            <div
              class="d-flex align-items-center justify-content-between mb-4 w-100"
            >
              <!-- หัวข้อหน้าจอ (อยู่ฝั่งซ้าย) -->

              <!-- ปุ่มเพิ่ม Sponsors (ถูกดันชิดมุมขวาด้วย ms-auto หรือ justify-content-between) -->
              <button
                type="button"
                class="btn btn-success-subtle text-success border border-success-subtle px-3 py-2 rounded-3 d-flex align-items-center shadow-sm hover-shadow ms-auto"
                data-bs-toggle="modal"
                data-bs-target="#addSponsorModal"
                style="
                  font-family: &quot;Kanit&quot;, sans-serif;
                  font-weight: 500;
                  transition: all 0.2s ease;
                "
              >
                <i class="bi bi-bag-heart me-2 fs-6"></i> เพิ่มผู้สนับสนุน
              </button>
            </div>

            <!-- แถวสำหรับแสดงการ์ด 6 รายการต่อแถวในหน้าจอใหญ่ -->
            <div class="row g-3" id="sponsorCardContainer">
            </div>
          </div>

          <!-- Modal เพิ่มผู้สนับสนุน -->
          <div
            class="modal fade"
            id="addSponsorModal"
            tabindex="-1"
            aria-labelledby="addSponsorModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-dialog-centered">
              <div
                class="modal-content border-0 shadow-lg rounded-4 overflow-hidden"
              >
                <!-- Modal Header -->
                <div class="modal-header bg-success text-white px-4 py-3">
                  <h5
                    class="modal-title fw-bold"
                    id="addSponsorModalLabel"
                    style="font-family: &quot;Google Sans&quot;, sans-serif"
                  >
                  <i class="bi bi-bag-heart"></i>  เพิ่มผู้สนับสนุนใหม่
                  </h5>
                  <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>

                <!-- Modal Body (ฟอร์มกรอกข้อมูล) -->
                <form id="addSponsorForm" enctype="multipart/form-data">
                  <div class="modal-body p-4">
                    <!-- รหัสผู้สนับสนุน -->
                    <div class="mb-3">
                      <label
                        for="sponsor_code"
                        class="form-label fw-bold text-dark"
                        style="font-size: 14px"
                        >รหัสผู้สนับสนุน (Sponsor Code)</label
                      >
                      <div class="input-group">
                        <input
                          type="text"
                          class="form-control rounded-start-3"
                          id="sponsor_code"
                          name="sponsor_code"
                          required
                          readonly
                          style="background-color: #f8f9fa"
                        />
                        <button
                          class="btn btn-outline-secondary rounded-end-3 px-3"
                          type="button"
                          onclick="generateSponsorCode()"
                          title="สุ่มรหัสใหม่"
                        >
                          <i class="bi bi-arrow-clockwise"></i> สุ่มใหม่
                        </button>
                      </div>
                      <div class="form-text text-muted" style="font-size: 12px">
                        รหัสจะถูกสร้างให้อัตโนมัติ สามารถกดปุ่มสุ่มใหม่ได้
                      </div>
                    </div>

                    <!-- ชื่อผู้สนับสนุน -->
                    <div class="mb-3">
                      <label
                        for="sponsor_name"
                        class="form-label fw-bold text-dark"
                        style="font-size: 14px"
                        >ชื่อผู้สนับสนุน / แบรนด์</label
                      >
                      <input
                        type="text"
                        class="form-control rounded-3"
                        id="sponsor_name"
                        name="sponsor_name"
                        required
                        placeholder="ระบุชื่อผู้สนับสนุน"
                      />
                    </div>

                    <!-- อัปโหลดรูปภาพโลโก้ -->
                    <div class="mb-3">
                      <label
                        for="sponsor_image"
                        class="form-label fw-bold text-dark"
                        style="font-size: 14px"
                        >รูปภาพโลโก้</label
                      >
                      <input
                        type="file"
                        class="form-control rounded-3"
                        id="sponsor_image"
                        name="image"
                        accept="image/*"
                        required
                        onchange="previewSponsorImage(event)"
                      />
                    </div>

                    <!-- พรีวิวรูปภาพ -->
                    <div class="text-center mb-2">
                      <img
                        id="sponsorImagePreview"
                        src="#"
                        alt="Image Preview"
                        class="rounded-3 shadow-sm border"
                        style="
                          display: none;
                          width: 120px;
                          height: 120px;
                          object-fit: cover;
                        "
                      />
                    </div>
                  </div>

                  <!-- Modal Footer -->
                  <div
                    class="modal-header bg-light border-0 px-4 py-3 justify-content-end"
                  >
                    <button
                      type="button"
                      class="btn btn-secondary px-3 py-2 rounded-3"
                      data-bs-dismiss="modal"
                      style="font-size: 14px"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      id="btnSaveSponsor"
                      class="btn btn-success px-4 py-2 rounded-3 ms-2 shadow-sm"
                      style="font-size: 14px; font-weight: 500"
                    >
                      บันทึกข้อมูล
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->

        <!-- Footer -->
        <footer class="sticky-footer bg-white py-3 border-top mt-auto">
          <div class="container my-auto">
            <div class="copyright text-center my-auto small text-muted">
              <span>Copyright &copy; Your Website 2026</span>
            </div>
          </div>
        </footer>
        <!-- End of Footer -->
      </div>
      <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Logout Modal-->
    <div
      class="modal fade"
      id="logoutModal"
      tabindex="-1"
      aria-labelledby="logoutModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="logoutModalLabel">Ready to Leave?</h5>
            <button
              class="btn-close"
              type="button"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            Select "Logout" below if you are ready to end your current session.
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-secondary"
              type="button"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <a class="btn btn-primary" href="#">Logout</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
